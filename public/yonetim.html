<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png"><link rel="apple-touch-icon" href="/favicon-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LaVie Yönetim</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Great+Vibes&family=Parisienne&family=Jost:wght@400;500&display=swap">
<style>
/* Tek sütun iş listesi: üstte sekmeler, altta sipariş kartları */
:root{--paper:#f6f3f1;--ink:#2b2a33;--muted:#6e6a72;--line:#e0d8d2;--accent:#5b4a6b;--field:#fff;--ok:#2f6440;--okbg:#e3efe6;--wait:#8a5a12;--waitbg:#f8ecd6;--off:#6e6a72;--offbg:#ece9ee;--bad:#a2464b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:"Italiana",Georgia,serif;font-size:1.8rem;letter-spacing:.05em;margin:0;font-weight:400}
.brand small{font-family:"Jost",sans-serif;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.b{font:inherit;font-size:.86rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b.main{background:var(--accent);border-color:var(--accent);color:#fff}
.b.green{background:#25d366;border-color:#25d366;color:#0b2b17}
.b.danger{color:var(--bad)}
.b[disabled]{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid #b08a4f;outline-offset:2px}
.login{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:grid;gap:10px;max-width:420px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.msg{color:var(--muted);font-size:.9rem}
.msg.err{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{font:inherit;font-size:.88rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab b{font-weight:500;font-variant-numeric:tabular-nums;margin-left:4px}
.list{display:grid;gap:12px}
.card{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.names{font-family:"Italiana",Georgia,serif;font-size:1.35rem;line-height:1.2;margin:0}
.pill{font-size:.75rem;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.bekliyor{background:var(--waitbg);color:var(--wait)}
.pill.aktif{background:var(--okbg);color:var(--ok)}
.pill.kapali{background:var(--offbg);color:var(--off)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.88rem}
.meta dt{color:var(--muted)}
.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.edit{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.f{display:grid;gap:3px;min-width:0}
.f span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.tr-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:#f1ece8;border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:.82rem;border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi div{background:#faf8f6;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:"Italiana",Georgia,serif;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.grafik{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:8px;border-bottom:1px solid var(--line)}
.grafik i{flex:1;min-width:0;background:#cbbfd6;border-radius:3px 3px 0 0;position:relative}
.grafik i.bu{background:var(--accent)}
.grafik i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.72rem;padding:3px 7px;border-radius:6px;white-space:nowrap;margin-bottom:4px;z-index:2}
.eksen{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.iki{grid-template-columns:1fr}}
.liste h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 6px}
.sat{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.88rem;padding:5px 0;border-top:1px solid #efe9e4;position:relative}
.sat:first-of-type{border-top:0}
.sat .c{position:absolute;left:0;bottom:0;height:2px;background:#d9cfe2;border-radius:2px}
.sat b{font-weight:500;font-variant-numeric:tabular-nums}
.huni{display:grid;gap:6px}
.huni div{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:.86rem}
@media (max-width:420px){.huni div{grid-template-columns:110px 1fr 46px}}
.huni em{font-style:normal;height:14px;border-radius:4px;background:var(--accent);display:block;min-width:2px}
.huni b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:5}

/* iPhone: tarih/saat kutuları taşmasın (ızgara hücresi küçülebilsin) */
.row>*,.f{min-width:0}
/* */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;min-height:46px;text-align:left}input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Lavie<small>Yönetim</small></h1>
    <div id="hdrBtns" hidden style="display:flex;gap:6px">
      <button class="b" id="yenile" type="button">Yenile</button>
      <button class="b" id="cikis" type="button">Çıkış</button>
    </div>
  </header>

  <form class="login" id="login">
    <label for="sifre" class="msg">Yönetim şifresi</label>
    <input id="sifre" type="password" autocomplete="current-password" required>
    <button class="b main" type="submit">Giriş yap</button>
    <div class="msg" id="lmsg"></div>
  </form>

  <div id="app" hidden>
    <div class="card" id="trafik" style="margin-bottom:12px">
      <div class="tr-ust"><h2 class="names" style="font-size:1.3rem">Site trafiği</h2>
        <div class="seg" id="trSeg"><button type="button" data-g="1">Bugün</button><button type="button" data-g="7" aria-pressed="true">7 gün</button><button type="button" data-g="30">30 gün</button></div></div>
      <div id="trIc"><div class="msg">Yükleniyor...</div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><div class="top"><h2 class="names" style="font-size:1.3rem">Shopier bağlantısı</h2><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="b" id="ixGonder" type="button">Arama motorlarına bildir</button><button class="b" id="spBagla" type="button">Bildirimleri bağla</button><button class="b" id="spTest" type="button">Test et</button></div></div>
      <pre id="spSonuc" hidden style="white-space:pre-wrap;font-size:.8rem;margin:10px 0 0;background:#f6f3f1;padding:10px;border-radius:8px"></pre></div>
    <div class="tabs" id="tabs" role="group" aria-label="Filtre"></div>
    <div class="list" id="list" style="margin-top:12px"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const API = "/api/yonetim";
const TASARIM = {zeytin:"Zeytin Gölgesi",pamuk:"Pamuk Şeker",papatya:"Papatya Sabahı",gece:"Yıldızlı Gece",seftali:"Şeftali Çiçeği",lavanta:"Lavanta Rüzgârı",gul:"Pudra Gülü",nane:"Nane Şekeri",ege:"Ege Çinisi",mono:"Siyah İnci"};
const TUR = ["Düğün","Nişan","Kına","Söz"];
const DURUM = {bekliyor:"Ödeme bekliyor",aktif:"Yayında",kapali:"Kapalı"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SIFRE = "", LISTE = [], YORUMLAR = [], FILTRE = "bekliyor", ACIK = null;

try { SIFRE = localStorage.getItem("lavie_sifre") || ""; } catch {}

function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(t._z); t._z=setTimeout(()=>t.hidden=true,2200); }
async function api(method, body){
  const r = await fetch(API, { method, headers: { "x-sifre": SIFRE, ...(body?{"content-type":"application/json"}:{}) }, body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({ok:false,hata:"baglanti"}));
  if (!j.ok) throw new Error(j.hata || "hata");
  return j;
}
function hataMetni(h){
  return h==="sifre" ? "Şifre yanlış." : h==="sifre_ayarlanmamis" ? "Yönetim şifresi henüz Cloudflare'da (ADMIN_SIFRE) ayarlanmamış." : "Bağlantı sorunu, tekrar deneyin.";
}
async function shopierTestEt(){
  const el=$("spSonuc"); el.hidden=false; el.textContent="Test ediliyor...";
  try { const j=await api("POST",{islem:"shopier-test"}); const r=j.sonuc;
    const st=x=>x.durum===200?"✓ çalışıyor":(x.durum===0?"✗ anahtar yok":"✗ "+x.durum+(x.hata?" · "+x.hata:""));
    el.textContent=`Anahtar: ${r.anahtar?"✓ tanımlı":"✗ yok (SHOPIER_PAT)"}\nMağaza: ${st(r.magaza)}${r.magaza.ad?" · "+r.magaza.ad:""}${r.magaza.adres?" · "+r.magaza.adres:""}\nÜrünler: ${st(r.urunler)}\nSiparişler: ${st(r.siparisler)}\nBildirimler (webhook): ${st(r.webhooklar)}\nKartla ödeme: ${r.kartAcik?"✓ açık":"✗ kapalı (ürün linki eklenmedi)"}${r.urunId?" · ürün "+r.urunId:""}\nOtomatik bildirim: ${r.bildirimBagli?"✓ bağlı":"✗ bağlı değil (Bildirimleri bağla)"}`;
  } catch(e){ el.textContent="Test yapılamadı: "+e.message; }
}
async function yukle(){
  const j = await api("GET");
  LISTE = j.ciftler; YORUMLAR = j.yorumlar || []; ciz();
  trafikYukle();
}
let TR_GUN = 7;
const KAYNAK_AD = {google:"Google",bing:"Bing",yandex:"Yandex",instagram:"Instagram",facebook:"Facebook",tiktok:"TikTok",pinterest:"Pinterest",whatsapp:"WhatsApp",davetiye:"Bir davetiyeden",ortak:"Ortak linki",diger:"Diğer siteler",dogrudan:"Doğrudan / WhatsApp"};
const SAYFA_AD = {"/":"Ana sayfa","/ornek":"Örnek davetiye","/d":"Müşteri davetiyeleri (misafirler)","/araclar":"Ücretsiz araçlar","/rehber":"Rehber","/2027-dugun-takvimi":"2027 düğün takvimi","/lcv-nedir":"LCV nedir?","/dugun-davetiyesi-sozleri":"Düğün davetiyesi sözleri","/kina-davetiyesi-sozleri":"Kına davetiyesi sözleri","/nisan-davetiyesi-sozleri":"Nişan davetiyesi sözleri","/davetiye-ne-zaman-gonderilir":"Davetiye ne zaman gönderilir?","/dijital-dugun-davetiyesi":"Dijital düğün davetiyesi","/dijital-nisan-davetiyesi":"Dijital nişan davetiyesi","/dijital-kina-davetiyesi":"Dijital kına davetiyesi","/dijital-soz-davetiyesi":"Dijital söz davetiyesi","/davetli-listesi":"Davetli listesi","/dugun-butcesi-hesaplama":"Düğün bütçesi hesaplama","/davetiye-sozu-olusturucu":"Davetiye sözü oluşturucu"};
const sayfaAd = y => SAYFA_AD[y] || y.slice(1).split("-").map((w,i)=>i?w:w.charAt(0).toLocaleUpperCase("tr")+w.slice(1)).join(" ");
const sayi = n => (Number(n)||0).toLocaleString("tr-TR");
async function trafikYukle(){
  document.querySelectorAll("#trSeg button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.g===TR_GUN)));
  try { const r = (await api("POST",{islem:"trafik",gun:TR_GUN})).sonuc; trafikCiz(r); }
  catch(e){ $("trIc").innerHTML = `<div class="msg err">Trafik yüklenemedi: ${esc(e.message)}</div>`; }
}
function trafikCiz(r){
  const gunler=[]; for(let i=29;i>=0;i--){ gunler.push(new Date(Date.parse(r.bugun+"T12:00:00Z")-i*864e5).toISOString().slice(0,10)); }
  const m = Object.fromEntries(r.gunluk.map(x=>[x.gun,x]));
  const aralik = gunler.slice(-r.gun);
  const top = k => aralik.reduce((a,g)=>a+((m[g]||{})[k]||0),0);
  const vitrin = top("v"), tum = top("z"), gor = top("g");
  const davetiye = r.sayfalar.filter(s=>s.yol==="/d").reduce((a,s)=>a+s.g,0);
  const sip = Object.values(r.siparis).reduce((a,b)=>a+b,0), odenen = r.siparis.aktif||0;
  const max = Math.max(1,...gunler.map(g=>(m[g]||{}).v||0));
  const bar = gunler.map(g=>{ const v=(m[g]||{}).v||0; const d=new Date(g+"T12:00"); return `<i class="${aralik.includes(g)?"bu":""}" style="height:${Math.max(2,v/max*100)}%" data-t="${d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}: ${v} ziyaretçi"></i>`; }).join("");
  const ks = r.kaynaklar, kmax = Math.max(1,...ks.map(k=>k.z));
  const sy = r.sayfalar.filter(s=>s.yol!=="/d"), smax = Math.max(1,...sy.map(s=>s.g));
  const mob = r.mobil.mobil||0, mas = r.mobil.masaustu||0;
  const huni = [["Siteye gelen",vitrin],["İsimle denedi",r.olaylar.dene||0],["Sipariş formunu gördü",r.olaylar.olustur||0],["Sipariş verdi",sip],["Ödedi",odenen]];
  const hmax = Math.max(1,...huni.map(h=>h[1]));
  const bos = !tum && !gor;
  $("trIc").innerHTML = `
    <div class="kpi">
      <div><b>${sayi(vitrin)}</b><span>Ziyaretçi (vitrin)</span></div>
      <div><b>${sayi(gor - davetiye)}</b><span>Sayfa görüntüleme</span></div>
      <div><b>${sayi(davetiye)}</b><span>Davetiye açılışı</span></div>
      <div><b>${sayi(sip)}</b><span>Sipariş${odenen?` · ${odenen} ödendi`:""}</span></div>
    </div>
    ${bos?`<div class="msg">Henüz kayıt yok. Sayaç bugün açıldı; ziyaretçiler geldikçe burada görünecek.</div>`:""}
    <div><div class="liste"><h3>Son 30 gün · günlük ziyaretçi</h3></div><div class="grafik">${bar}</div><div class="eksen"><span>${new Date(gunler[0]+"T12:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}</span><span>Bugün</span></div></div>
    <div class="iki">
      <div class="liste"><h3>Nereden geldiler</h3>${ks.length?ks.map(k=>`<div class="sat"><span>${esc(KAYNAK_AD[k.kaynak]||k.kaynak)}</span><b>${sayi(k.z)}</b><i class="c" style="width:${k.z/kmax*100}%"></i></div>`).join(""):`<div class="msg">Veri yok</div>`}
        ${mob+mas?`<div class="msg" style="margin-top:6px">Telefon %${Math.round(mob/(mob+mas)*100)} · Bilgisayar %${Math.round(mas/(mob+mas)*100)}</div>`:""}</div>
      <div class="liste"><h3>En çok bakılan sayfalar</h3>${sy.length?sy.map(s=>`<div class="sat"><span>${esc(sayfaAd(s.yol))}</span><b>${sayi(s.g)}</b><i class="c" style="width:${s.g/smax*100}%"></i></div>`).join(""):`<div class="msg">Veri yok</div>`}</div>
    </div>
    <div class="liste"><h3>Müşteriye dönüşme</h3><div class="huni">${huni.map(([a,n])=>`<div><span>${a}</span><em style="width:${n/hmax*100}%"></em><b>${sayi(n)}</b></div>`).join("")}</div></div>`;
}
document.addEventListener("click", e=>{ const b=e.target.closest("#trSeg button"); if(!b) return; TR_GUN=+b.dataset.g; trafikYukle(); });
async function giris(){
  $("lmsg").className="msg"; $("lmsg").textContent="Kontrol ediliyor...";
  try { await yukle(); try{localStorage.setItem("lavie_sifre",SIFRE);}catch{}
    $("login").hidden=true; $("app").hidden=false; $("hdrBtns").hidden=false; $("hdrBtns").style.display="flex";
  } catch(e){ $("lmsg").className="msg err"; $("lmsg").textContent=hataMetni(e.message); }
}
function tarihYaz(c){
  if(!c.tarih) return "";
  const d=new Date(c.tarih+"T00:00"); const t=isNaN(d)?c.tarih:d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  return t + (c.saat?" · "+c.saat:"");
}
function waNo(tel){ let n=String(tel||"").replace(/\D/g,""); if(n.startsWith("0")) n="9"+n; else if(n.length===10) n="90"+n; return n.length>=12?n:""; }
function ciz(){
  const say = {bekliyor:0,aktif:0,kapali:0,hepsi:LISTE.length};
  LISTE.forEach(c=>say[c.durum]=(say[c.durum]||0)+1);
  $("tabs").innerHTML = [["bekliyor","Bekleyen"],["aktif","Yayında"],["kapali","Kapalı"],["hepsi","Tümü"]]
    .concat([["yorum","Yorumlar"]])
    .map(([k,l])=>`<button class="tab" type="button" data-f="${k}" aria-pressed="${FILTRE===k}">${l}<b>${k==="yorum"?YORUMLAR.filter(y=>!y.onay).length+"/"+YORUMLAR.length:(say[k]||0)}</b></button>`).join("");
  const ortak = {}; LISTE.filter(c=>c.ref).forEach(c=>{ const o=ortak[c.ref]||(ortak[c.ref]={t:0,a:0}); o.t++; if(c.durum==="aktif") o.a++; });
  $("tabs").insertAdjacentHTML("beforeend", Object.keys(ortak).length ? `<div class="msg" style="width:100%;margin-top:6px">Ortaklar: ${Object.entries(ortak).map(([k,o])=>`<b>${esc(k)}</b> ${o.a}/${o.t}`).join(" · ")} <span style="opacity:.7">(ödenen/toplam)</span></div>` : "");
  if (FILTRE === "yorum") {
    $("list").innerHTML = YORUMLAR.length ? YORUMLAR.map(y => `<article class="card" data-y="${esc(y.slug)}">
      <div class="top"><h2 class="names">${esc(y.ad)}</h2><span class="pill ${y.onay?"aktif":"bekliyor"}">${y.onay?"Sitede":"Onay bekliyor"}</span></div>
      <div style="color:#b08a4f;letter-spacing:2px">${"★".repeat(y.puan)}<span style="color:#d8cfc6">${"★".repeat(5-y.puan)}</span></div>
      <p style="margin:0;font-style:italic">${esc(y.yorum)}</p>
      <div class="acts">
        <button class="b ${y.onay?"":"main"}" data-ya="${y.onay?"gizle":"onay"}">${y.onay?"Siteden kaldır":"Onayla, sitede göster"}</button>
        <button class="b danger" data-ya="sil">Sil</button>
      </div></article>`).join("") : `<div class="empty">Henüz yorum yok. Çiftler panellerindeki "Bizi değerlendirin" bölümünden yorum bırakınca burada görünür.</div>`;
    return;
  }
  const liste = LISTE.filter(c=>FILTRE==="hepsi"||c.durum===FILTRE);
  $("list").innerHTML = liste.length ? liste.map(kart).join("") :
    `<div class="empty">${FILTRE==="bekliyor"?"Bekleyen sipariş yok. Yeni sipariş gelince burada görünecek.":"Bu bölümde davetiye yok."}</div>`;
}
function kart(c){
  const wa = waNo(c.telefon);
  const ac = ACIK===c.slug;
  return `<article class="card" data-s="${esc(c.slug)}">
    <div class="top"><h2 class="names">${esc(c.gelin)} &amp; ${esc(c.damat)}</h2><span class="pill ${esc(c.durum)}">${DURUM[c.durum]||esc(c.durum)}</span></div>
    <dl class="meta">
      <dt>Tür</dt><dd>${esc(c.tur)} · ${esc(TASARIM[c.tasarim]||c.tasarim)}</dd>
      <dt>Tarih</dt><dd>${esc(tarihYaz(c))}</dd>
      <dt>Mekân</dt><dd>${esc(c.mekan)}</dd>
      <dt>Telefon</dt><dd>${c.telefon?esc(c.telefon):"–"}</dd>
      <dt>Ödeme</dt><dd>${c.odeme?`Kartla ödendi · Shopier #${esc(c.odeme.siparis)}`:(c.kartZaman?"Kartla ödeme başlatıldı":"–")}</dd>
      <dt>Kod</dt><dd>${esc(c.slug)}</dd>
      ${c.ref?`<dt>Ortak</dt><dd><b>${esc(c.ref)}</b></dd>`:""}
      <dt>Yanıt</dt><dd>${c.yanitSayisi} misafir</dd>
      <dt>Sipariş</dt><dd>${c.olusturma?esc(new Date(c.olusturma).toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})):"–"}</dd>
    </dl>
    <div class="acts">
      ${c.durum==="bekliyor"?`<button class="b main" data-a="aktif">Ödeme alındı, yayınla</button><button class="b" data-a="odemeAra">Shopier'de ödeme ara</button>`:""}
      ${c.durum==="aktif"?`<button class="b" data-a="kapali">Yayından kaldır</button>`:""}
      ${c.durum==="kapali"?`<button class="b" data-a="aktif">Tekrar yayınla</button>`:""}
      ${c.durum==="aktif"&&wa?`<a class="b green" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(mesaj(c))}">Linkleri çifte gönder</a>`:""}
      ${c.durum==="aktif"?`<a class="b" target="_blank" rel="noopener" href="${esc(c.linkler.davetiye)}">Davetiyeyi aç</a>`:""}
      <button class="b" data-a="kopyaD">Davetiye linki</button>
      <button class="b" data-a="kopyaP">Panel linki</button>
      <button class="b" data-a="duzenle">${ac?"Düzenlemeyi kapat":"Düzenle"}</button>
      <button class="b danger" data-a="sil">Sil</button>
    </div>
    ${ac?formHTML(c):""}
  </article>`;
}
function mesaj(c){
  return `Merhaba, ${c.gelin} & ${c.damat} davetiyeniz hazır!\n\nMisafirlerinizle paylaşacağınız davetiye linki:\n${c.linkler.davetiye}\n\nKatılım yanıtlarını görebileceğiniz size özel panel (paylaşmayın):\n${c.linkler.panel}\n\nMutluluklar dileriz. Lavie`;
}
function formHTML(c){
  const inp=(k,l,t="text")=>`<label class="f"><span>${l}</span><input name="${k}" type="${t}" value="${esc(c[k])}"></label>`;
  return `<form class="edit" data-s="${esc(c.slug)}">
    <div class="row">${inp("gelin","Gelin")}${inp("damat","Damat")}</div>
    <div class="row">${inp("tarih","Tarih","date")}${inp("saat","Saat","time")}</div>
    <div class="row">
      <label class="f"><span>Tasarım</span><select name="tasarim">${Object.entries(TASARIM).map(([k,v])=>`<option value="${k}" ${c.tasarim===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>Tür</span><select name="tur">${TUR.map(t=>`<option ${c.tur===t?"selected":""}>${t}</option>`).join("")}</select></label>
    </div>
    <div class="row">
      <label class="f"><span>Müzik</span><select name="muzik">${[["piyano","Düğün Piyanosu"],["kirlar","Yeşil Kırlar"],["yok","Müzik yok"]].map(([k,v])=>`<option value="${k}" ${((c.muzik==="kutu"||!c.muzik)?"piyano":c.muzik)===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>Yazı stili</span><select name="yazi">${[["","Tasarımın yazısı"],["el","El yazısı"],["zarif","Zarif"],["klasik","Klasik"],["modern","Modern"],["bodoni","Moda"],["sade","Sade"]].map(([k,v])=>`<option value="${k}" ${(c.yazi||"")===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="f"><span>Paket</span><select name="paket"><option value="site" ${c.paket!=="site-gorsel"?"selected":""}>Davetiye sitesi</option><option value="site-gorsel" ${c.paket==="site-gorsel"?"selected":""}>Site + paylaşım görseli</option></select></label>
    </div>
    ${inp("mekan","Mekân")}${inp("adres","Adres")}${inp("konum","Konum linki","url")}${inp("aile","Aile isimleri")}${inp("telefon","Telefon","tel")}
    <label class="f"><span>Davet notu</span><textarea name="not">${esc(c.not)}</textarea></label>
    ${inp("katilimNotu","Katılım notu")}
    <label class="f"><span>Program</span><textarea name="program" rows="4">${esc(c.program)}</textarea></label>
    <button class="b main" type="submit">Kaydet</button>
  </form>`;
}
async function kopyala(t){
  try{ await navigator.clipboard.writeText(t); toast("Kopyalandı"); }
  catch{ window.prompt("Linki kopyalayın:", t); }
}

$("login").addEventListener("submit", e=>{ e.preventDefault(); SIFRE=$("sifre").value; giris(); });
$("cikis").onclick=()=>{ try{localStorage.removeItem("lavie_sifre");}catch{} location.reload(); };
$("yenile").onclick=async()=>{ try{ await yukle(); toast("Güncellendi"); }catch(e){ toast(hataMetni(e.message)); } };
$("tabs").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(!b) return; FILTRE=b.dataset.f; ciz(); });
$("list").addEventListener("click", async e=>{
  const yb=e.target.closest("button[data-ya]");
  if(yb){
    const ys=yb.closest(".card").dataset.y, y=YORUMLAR.find(x=>x.slug===ys), a=yb.dataset.ya;
    if(a==="sil" && !confirm("Bu yorum silinsin mi?")) return;
    yb.disabled=true;
    try{
      if(a==="sil"){ await api("POST",{islem:"yorum-sil",slug:ys}); YORUMLAR=YORUMLAR.filter(x=>x.slug!==ys); toast("Silindi"); }
      else { await api("POST",{islem:"yorum-onay",slug:ys,onay:a==="onay"}); y.onay=a==="onay"; toast(y.onay?"Sitede yayında":"Siteden kaldırıldı"); }
      ciz();
    }catch(err){ yb.disabled=false; toast(hataMetni(err.message)); }
    return;
  }
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const slug=b.closest(".card").dataset.s, c=LISTE.find(x=>x.slug===slug), a=b.dataset.a;
  if(a==="kopyaD") return kopyala(c.linkler.davetiye);
  if(a==="kopyaP") return kopyala(c.linkler.panel);
  if(a==="duzenle"){ ACIK = ACIK===slug?null:slug; return ciz(); }
  if(a==="odemeAra"){ b.disabled=true; b.textContent="Aranıyor...";
    try{ const j=await api("POST",{islem:"odeme-ara",slug}); Object.assign(c,j.cift); toast(j.bulundu?"Ödeme bulundu, yayında":"Shopier'de eşleşen ödeme yok"); if(j.bulundu) FILTRE="aktif"; ciz(); }
    catch(err){ b.disabled=false; b.textContent="Shopier'de ödeme ara"; toast("Shopier'e ulaşılamadı: "+err.message); } return; }
  if(a==="sil" && !confirm(`${c.gelin} & ${c.damat} davetiyesi ve tüm misafir yanıtları silinsin mi? Bu geri alınamaz.`)) return;
  b.disabled=true;
  try{
    if(a==="sil"){ await api("POST",{islem:"sil",slug}); LISTE=LISTE.filter(x=>x.slug!==slug); toast("Silindi"); }
    else { const j=await api("POST",{islem:"durum",slug,durum:a}); Object.assign(c,j.cift); toast(a==="aktif"?"Yayında":"Yayından kaldırıldı");
      if(a==="aktif") FILTRE="aktif"; }
    ciz();
  }catch(err){ b.disabled=false; toast(hataMetni(err.message)); }
});
$("list").addEventListener("submit", async e=>{
  e.preventDefault(); const f=e.target, slug=f.dataset.s, c=LISTE.find(x=>x.slug===slug);
  const alanlar=Object.fromEntries(new FormData(f).entries());
  const btn=f.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="Kaydediliyor...";
  try{ const j=await api("POST",{islem:"guncelle",slug,alanlar}); Object.assign(c,j.cift); ACIK=null; ciz(); toast("Kaydedildi"); }
  catch(err){ btn.disabled=false; btn.textContent="Kaydet"; toast(hataMetni(err.message)); }
});

if (SIFRE) { $("sifre").value=SIFRE; giris(); }
$("spTest").onclick=shopierTestEt;
$("ixGonder").onclick=async()=>{ const el=$("spSonuc"); el.hidden=false; el.textContent="Bing ve Yandex'e bildiriliyor...";
  try{ const r=(await api("POST",{islem:"indexnow"})).sonuc; el.textContent=r.ok?`✓ ${r.adet} sayfa Bing, Yandex ve diğer arama motorlarına bildirildi. (Her pazartesi kendiliğinden tekrarlanır.)`:`✗ Bildirilemedi: ${r.durum||""} ${r.hata||""}`; }
  catch(e){ el.textContent="Bildirilemedi: "+e.message; } };
$("spBagla").onclick=async()=>{ const el=$("spSonuc"); el.hidden=false; el.textContent="Bağlanıyor...";
  try{ const j=await api("POST",{islem:"shopier-bagla"}); const r=j.sonuc; el.textContent=r.ok?"✓ Bildirimler bağlandı. Shopier'de her yeni siparişte site otomatik kontrol edecek.":"✗ Bağlanamadı: "+(r.durum||"")+" "+(r.hata||""); }
  catch(e){ el.textContent="Bağlanamadı: "+e.message; } };
</script>
