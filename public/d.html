<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Davetiye · Lavie</title>
<meta name="robots" content="noindex">
<!--og--><meta property="og:title" content="Davetiyemiz · Lavie"><meta property="og:description" content="Davetiyemizi açmak için dokunun."><meta property="og:image" content="https://laviedavetiye.netlify.app/og/lavie.jpg"><meta name="twitter:card" content="summary_large_image"><!--/og-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Great+Vibes&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="davetiye.css">
<style>
[hidden]{display:none!important}
html,body{margin:0;background:#e9e6e3}
#kok{max-width:480px;margin:0 auto;container-type:inline-size;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)}
.durum{font-family:"Cormorant Garamond",Georgia,serif;text-align:center;padding:40vh 24px 0;color:#5a5560;font-size:1.2rem}

/* Zarf açılışı */
.zarf{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);transition:opacity .8s ease .9s}
.zarf .ic{width:min(84vw,380px);display:grid;justify-items:center;gap:28px;text-align:center}
.zarf .ust{font-family:var(--fd);letter-spacing:.32em;text-transform:uppercase;font-size:.78rem;color:var(--soft)}
.zarf .govde{position:relative;width:100%;aspect-ratio:1.45;perspective:1200px}
.zarf .arka,.zarf .on,.zarf .kapak{position:absolute;inset:0}
.zarf .arka{background:var(--bg2);border:1px solid var(--line2)}
.zarf .mektup{position:absolute;left:7%;right:7%;top:8%;bottom:8%;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;transition:transform .9s cubic-bezier(.3,.7,.2,1) .45s;z-index:1;padding:0 8px}
.zarf .mektup span{font-family:var(--fn);font-size:2rem;color:var(--fg);line-height:1.1}
.zarf .on{z-index:2;border:1px solid var(--line2);background:linear-gradient(to top right,transparent calc(50% - 1px),var(--line2) 50%,transparent calc(50% + 1px)) left/50% 100% no-repeat,linear-gradient(to top left,transparent calc(50% - 1px),var(--line2) 50%,transparent calc(50% + 1px)) right/50% 100% no-repeat,var(--bg2)}
.zarf .kapak{z-index:3;transform-origin:top;transition:transform .7s ease,z-index 0s .35s;clip-path:polygon(0 0,100% 0,50% 58%);background:var(--bg2);filter:brightness(.96)}
.zarf .muhur{position:absolute;z-index:4;left:50%;top:58%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;font-family:var(--fn);font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:opacity .3s}
.zarf .ac{font-family:var(--ft);font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;padding:14px 26px;border:1px solid var(--acc);color:var(--acc);background:transparent;cursor:pointer}
.zarf.acik .kapak{transform:rotateX(180deg);z-index:0}
.zarf.acik .muhur{opacity:0}
.zarf.acik .mektup{transform:translateY(-62%)}
.zarf.acik .ac{visibility:hidden}
.zarf.bitti{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.zarf,.zarf *{transition:none!important}}

/* Müzik düğmesi */
.mz{position:fixed;z-index:30;right:max(14px,calc(50vw - 240px + 14px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:var(--acc);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:0}
.mz.inv{min-height:0;height:46px}
.mz svg{width:20px;height:20px}
</style>
</head>
<body>
<main id="kok"><div class="durum">Davetiye yükleniyor...</div></main>
<script src="ayarlar.js"></script>
<script src="davetiye.js"></script>
<script src="muzik.js"></script>
<script>
(async () => {
  const kok = document.getElementById("kok");
  const API = window.LAVIE_AYAR.API_URL;
  const slug = new URLSearchParams(location.search).get("c") || "";
  const hata = m => { kok.innerHTML = `<div class="durum">${m}</div>`; };
  const esc = window.Lavie.esc;
  if (!slug) return hata("Davetiye linki eksik.");
  let j;
  try {
    const r = await fetch(API + "/cift?c=" + encodeURIComponent(slug));
    j = await r.json();
  } catch (e) { return hata("Davetiye yüklenemedi. Lütfen sayfayı yenileyin."); }
  if (!j.ok) return hata("Bu davetiye bulunamadı.");
  const d = j.cift;
  document.title = `${d.gelin} & ${d.damat} · ${d.tur || "Davetiye"}`;

  window.Lavie.ciz(kok, d, async v => {
    const r2 = await fetch(API + "/yanit", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ c: slug, ...v }) });
    const j2 = await r2.json();
    if (!j2.ok) throw new Error(j2.hata || "hata");
  }, {
    mesajlar: j.mesajlar,
    mesajGonder: async v => {
      const r3 = await fetch(API + "/mesaj", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ c: slug, ...v }) });
      const j3 = await r3.json();
      if (!j3.ok) throw new Error(j3.hata || "hata");
      return j3.mesaj;
    }
  });

  // Zarf
  const bas = s => (String(s || "").trim()[0] || "").toLocaleUpperCase("tr-TR");
  const tema = `inv t-${d.tasarim || "zeytin"}`;
  const zarf = document.createElement("div");
  zarf.className = `zarf ${tema}`;
  zarf.setAttribute("role", "dialog"); zarf.setAttribute("aria-label", "Davetiye zarfı");
  zarf.innerHTML = `<div class="ic">
      <div class="ust">Size bir davetiyemiz var</div>
      <div class="govde">
        <div class="arka"></div>
        <div class="mektup"><span>${esc(d.gelin)} &amp; ${esc(d.damat)}</span></div>
        <div class="on"></div><div class="kapak"></div>
        <div class="muhur">${esc(bas(d.gelin))}${esc(bas(d.damat))}</div>
      </div>
      <button class="ac" type="button">Davetiyeyi aç</button>
    </div>`;
  document.body.appendChild(zarf);
  document.body.style.overflow = "hidden";

  // Müzik düğmesi
  const M = window.LavieMuzik;
  const muzikVar = d.muzik !== "yok" && !!M;
  let mz = null;
  const guncelle = () => {
    if (!mz) return;
    const acik = M.calisiyor();
    mz.querySelector(".cizgi").style.display = acik ? "none" : "";
    mz.setAttribute("aria-label", acik ? "Müziği kapat" : "Müziği aç");
  };
  if (muzikVar) {
    mz = document.createElement("button");
    mz.type = "button"; mz.className = `mz ${tema}`; mz.hidden = true;
    mz.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="cizgi" d="M3 3l18 18"/></svg>`;
    mz.onclick = () => { M.calisiyor() ? M.durdur() : M.baslat(d.muzik); guncelle(); };
    document.addEventListener("visibilitychange", () => setTimeout(guncelle, 50));
    document.body.appendChild(mz);
  }

  zarf.querySelector(".ac").addEventListener("click", () => {
    if (muzikVar) { M.baslat(d.muzik); mz.hidden = false; guncelle(); }
    zarf.classList.add("acik");
    setTimeout(() => zarf.classList.add("bitti"), 900);
    setTimeout(() => { zarf.remove(); document.body.style.overflow = ""; }, 1800);
  });
})();
</script>
</body>
</html>
