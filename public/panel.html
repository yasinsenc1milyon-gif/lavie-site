<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Çift Paneli · Lavie</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Marcellus&family=Great+Vibes&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="davetiye.css">
<style>
/* Tek sütun: başlık, özet, sekmeli bölümler (misafirler, fotoğraflar, hatıra defteri, yorum) */
:root{--paper:#f6f3f1;--ink:#2b2a33;--muted:#6e6a72;--line:#e0d8d2;--accent:#5b4a6b;--field:#fff;--gold:#b08a4f;--ok:#2f6440;--bad:#a2464b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:16px}
.brand{font-family:"Italiana",Georgia,serif;font-size:1.3rem;letter-spacing:.06em;color:var(--muted)}
h1{font-family:"Italiana",Georgia,serif;font-weight:400;font-size:2.1rem;margin:0;text-wrap:balance;line-height:1.15}
h2{font-family:"Italiana",Georgia,serif;font-weight:400;font-size:1.4rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--field)}
.stat b{display:block;font-family:"Italiana",Georgia,serif;font-size:2rem;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.yes b{color:#3f7a4f}.stat.no b{color:#a2464b}
.stat span{font-size:.8rem;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:160px}
input,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%}
textarea{resize:vertical;min-height:90px}
.b{font:inherit;font-size:.88rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b.main{background:var(--accent);border-color:var(--accent);color:#fff}
.b[disabled]{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.linkbox{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.linkbox code{font-family:inherit;font-size:.88rem;overflow-wrap:anywhere;color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{font:inherit;font-size:.92rem;padding:10px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab b{font-weight:500;font-variant-numeric:tabular-nums;margin-left:4px}
.pane{display:grid;gap:12px}
.tbl{overflow-x:auto;background:var(--field);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:420px}
th{text-align:left;font-weight:500;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{font-size:.78rem;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.yes{background:#e3efe6;color:#2f6440}.pill.no{background:#f5e3e4;color:#8a3439}.pill.wait{background:#f8ecd6;color:#8a5a12}
.mk{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.mk p{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.1rem;line-height:1.45}
.mk div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.mk button{font:inherit;font-size:.8rem;border:0;background:none;color:var(--bad);cursor:pointer}
.stars{display:flex;gap:4px}
.stars button{font-size:1.8rem;line-height:1;border:0;background:none;cursor:pointer;color:#d8cfc6;padding:2px}
.stars button.on{color:var(--gold)}
.msg{color:var(--muted);padding:24px 0}
.muted{color:var(--muted);font-size:.85rem}
.note{background:#f8ecd6;color:#6b4710;border-radius:10px;padding:10px 12px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:5}
a{color:var(--accent)}
.duz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:start}
@media (max-width:760px){.duz{grid-template-columns:minmax(0,1fr)}}
.duz form{display:grid;gap:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:16px}
.duz .f{display:grid;gap:4px;min-width:0}
.duz .f > span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.duz .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.duz .row{grid-template-columns:1fr}}
.duz input,.duz textarea{font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.86rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.yz button{font-size:1rem}
.onizle-kap{position:sticky;top:12px;display:grid;gap:6px;justify-items:center}
@media (max-width:760px){.onizle-kap{position:static}}
.onizle{width:100%;max-width:340px;height:min(600px,75vh);border-radius:28px;border:8px solid #1d1b22;background:#1d1b22;overflow:hidden}
.onizle > div{height:100%;overflow-y:auto;border-radius:20px;container-type:inline-size}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="brand">Lavie</div>
  <div class="msg" id="msg">Yükleniyor...</div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="ayarlar.js"></script>
<script src="gorsel.js"></script>
<script src="davetiye.js"></script>
<script src="muzik.js"></script>
<script>
const API = window.LAVIE_AYAR.API_URL;
const q = new URLSearchParams(location.search), slug = q.get("c") || "", key = q.get("k") || "";
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let V = null, SEKME = "misafir", PUAN = 5, TASLAK = null;

function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(t._z); t._z=setTimeout(()=>t.hidden=true,2400); }
async function yukle(){
  const r = await fetch(`${API}/panel?c=${encodeURIComponent(slug)}&k=${encodeURIComponent(key)}`);
  const j = await r.json();
  if (!j.ok) throw new Error(j.hata);
  V = j; if (V.yorum) PUAN = V.yorum.puan;
}
async function islem(body){
  const r = await fetch(`${API}/panel`, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ c: slug, k: key, ...body }) });
  const j = await r.json().catch(()=>({ok:false}));
  if (!j.ok) throw new Error(j.hata || "hata");
  return j;
}
const davetLink = () => location.origin + "/d.html?c=" + encodeURIComponent(slug);
async function kopyala(t){ try{ await navigator.clipboard.writeText(t); toast("Link kopyalandı"); } catch { window.prompt("Linki kopyalayın:", t); } }

function iskelet(){
  const c = V.cift;
  app.innerHTML = `<div class="brand">Lavie</div>
    <h1>${esc(c.gelin)} &amp; ${esc(c.damat)}</h1>
    ${V.ornek ? `<div class="note">Bu örnek bir paneldir; burada değişiklik yapılamaz.</div>` : ""}
    <div class="linkbox">
      <span class="muted">Misafirlerinizle paylaşacağınız davetiye linki</span>
      <code>${esc(davetLink())}</code>
      <div class="bar">
        <button class="b main" id="kopya" type="button">Linki kopyala</button>
        <a class="b" href="https://wa.me/?text=${encodeURIComponent("Davetiyemiz: " + davetLink())}" target="_blank" rel="noopener">WhatsApp'ta paylaş</a>
        <a class="b" href="${esc(davetLink())}" target="_blank" rel="noopener">Davetiyeyi aç</a>
        ${c.paket === "site-gorsel" ? `<button class="b" id="gorsel" type="button">Paylaşım görseli</button>` : ""}
      </div>
    </div>
    <div class="bar"><a class="b" href="https://wa.me/${window.LAVIE_AYAR.WHATSAPP}?text=${encodeURIComponent(`Merhaba Lavie, panelim hakkında yardım istiyorum. Davetiye kodum: ${slug}`)}" target="_blank" rel="noopener" style="background:#25d366;border-color:#25d366;color:#0b2b17">WhatsApp destek hattı</a><span class="muted">Sorunuz olursa yazın, yardımcı olalım.</span></div>
    <div class="stats">
      <div class="stat yes"><b id="sYes">0</b><span>Gelecek kişi</span></div>
      <div class="stat no"><b id="sNo">0</b><span>Gelemeyecek</span></div>
      <div class="stat"><b id="sAll">0</b><span>Toplam yanıt</span></div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane"></div>
    <div class="muted">Bu panel linki size özeldir, misafirlerinizle paylaşmayın.</div>`;
  $("kopya").onclick = () => kopyala(davetLink());
  if ($("gorsel")) $("gorsel").onclick = () => window.LavieGorsel.goster(V.cift);
  $("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) { SEKME = b.dataset.s; ciz(); } });
}

function ciz(){
  const gel = V.yanitlar.filter(x => x.durum === "Katılacak");
  $("sYes").textContent = gel.reduce((a,x) => a + x.kisi, 0);
  $("sNo").textContent = V.yanitlar.length - gel.length;
  $("sAll").textContent = V.yanitlar.length;
  $("tabs").innerHTML = [["misafir","Misafirler",V.yanitlar.length],["bilgi","Davetiye bilgileri",""],["defter","Hatıra defteri",V.mesajlar.length],["yorum","Bizi değerlendirin",""]]
    .map(([k,l,n]) => `<button class="tab" role="tab" type="button" data-s="${k}" aria-selected="${SEKME===k}">${l}${n!==""?`<b>${n}</b>`:""}</button>`).join("");
  const p = $("pane");
  if (SEKME === "misafir") {
    p.innerHTML = `<div class="bar"><input id="ara" placeholder="Misafir ara" aria-label="Misafir ara"><button class="b" id="yenile" type="button">Yenile</button><button class="b" id="indir" type="button">Excel'e indir</button></div>
      <div class="tbl"><table><thead><tr><th>İsim</th><th>Kişi</th><th>Durum</th><th>Tarih</th></tr></thead><tbody id="rows"></tbody></table></div>`;
    const satirlar = (f="") => {
      f = f.toLocaleLowerCase("tr");
      const rows = V.yanitlar.filter(x => !f || x.isim.toLocaleLowerCase("tr").includes(f));
      $("rows").innerHTML = rows.length ? rows.map(x => `<tr><td>${esc(x.isim)}</td><td>${x.durum==="Katılacak"?x.kisi:"–"}</td><td><span class="pill ${x.durum==="Katılacak"?"yes":"no"}">${esc(x.durum)}</span></td><td>${new Date(x.zaman).toLocaleString("tr-TR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td></tr>`).join("")
        : `<tr><td colspan="4" class="muted">${V.yanitlar.length ? "Aramaya uyan misafir yok." : "Henüz yanıt yok. Davetiye linkinizi paylaştıkça yanıtlar burada görünecek."}</td></tr>`;
    };
    satirlar();
    $("ara").oninput = e => satirlar(e.target.value);
    $("indir").onclick = csv;
    $("yenile").onclick = async e => { e.target.textContent = "Yenileniyor..."; try { await yukle(); ciz(); } finally { e.target.textContent = "Yenile"; } };
  }
  if (SEKME === "bilgi") bilgiCiz(p);
  if (SEKME === "defter") {
    p.innerHTML = V.mesajlar.length ? V.mesajlar.map(m => `<div class="mk"><p>${esc(m.mesaj)}</p><div><span>${esc(m.isim)} · ${new Date(m.zaman).toLocaleDateString("tr-TR",{day:"numeric",month:"long"})}</span>${V.ornek?"":`<button type="button" data-msil="${esc(m.id)}">Kaldır</button>`}</div></div>`).join("")
      : `<p class="muted">Henüz mesaj yok. Misafirleriniz davetiyedeki Hatıra Defteri'ne yazdıkça burada görünecek.</p>`;
    p.querySelectorAll("[data-msil]").forEach(b => b.onclick = async () => {
      if (!confirm("Bu mesaj davetiyeden kaldırılsın mı?")) return;
      try { await islem({ islem: "mesaj-sil", id: b.dataset.msil }); V.mesajlar = V.mesajlar.filter(m => m.id !== b.dataset.msil); ciz(); toast("Mesaj kaldırıldı"); }
      catch { toast("Kaldırılamadı, tekrar deneyin."); }
    });
  }
  if (SEKME === "yorum") {
    const y = V.yorum;
    p.innerHTML = `<p class="muted" style="margin:0">Lavie'den memnun kaldıysanız birkaç cümleyle anlatın. Onaylandıktan sonra sitemizde adlarınızla (yalnızca ilk isimler) yayınlanır.</p>
      ${y ? `<div><span class="pill ${y.onay?"yes":"wait"}">${y.onay?"Sitede yayında":"Onay bekliyor"}</span></div>` : ""}
      <div class="stars" id="stars" role="radiogroup" aria-label="Puan">${[1,2,3,4,5].map(i => `<button type="button" role="radio" aria-checked="${i===PUAN}" aria-label="${i} yıldız" data-p="${i}" class="${i<=PUAN?"on":""}">★</button>`).join("")}</div>
      <textarea id="ytext" maxlength="500" placeholder="Deneyiminizi yazın">${esc(y?.yorum || "")}</textarea>
      <div><button class="b main" id="ygonder" type="button" ${V.ornek?"disabled":""}>${y?"Yorumu güncelle":"Gönder"}</button></div>`;
    $("stars").onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; PUAN = Number(b.dataset.p); p.querySelectorAll("[data-p]").forEach(x => { x.classList.toggle("on", Number(x.dataset.p) <= PUAN); x.setAttribute("aria-checked", Number(x.dataset.p) === PUAN); }); };
    $("ygonder").onclick = async e => {
      const t = $("ytext").value.trim();
      if (t.length < 5) return toast("Lütfen birkaç kelime yazın.");
      e.target.disabled = true;
      try { await islem({ islem: "yorum", puan: PUAN, yorum: t }); V.yorum = { puan: PUAN, yorum: t, onay: false }; ciz(); toast("Teşekkürler! Yorumunuz onaya gönderildi."); }
      catch { e.target.disabled = false; toast("Gönderilemedi, tekrar deneyin."); }
    };
  }
}

// Çiftin davetiye bilgilerini kendisinin düzenlemesi
function bilgiCiz(p){
  const L = window.Lavie;
  if (!TASLAK) TASLAK = { ...V.cift };
  const inp = (k, l, t="text", ek="") => `<label class="f"><span>${l}</span><input name="${k}" type="${t}" value="${esc(TASLAK[k])}" ${ek}></label>`;
  const ta = (k, l, r=3) => `<label class="f"><span>${l}</span><textarea name="${k}" rows="${r}">${esc(TASLAK[k])}</textarea></label>`;
  p.innerHTML = `<div class="duz">
    <form id="bf">
      <div class="f"><span>Davet türü</span><div class="seg" data-alan="tur">${L.TURLER.map(t => `<button type="button" data-v="${t}" aria-pressed="${TASLAK.tur===t}">${t}</button>`).join("")}</div></div>
      <div class="f"><span>Tasarım</span><div class="seg" data-alan="tasarim">${L.TASARIMLAR.map(t => `<button type="button" data-v="${t.id}" aria-pressed="${TASLAK.tasarim===t.id}">${t.ad}</button>`).join("")}</div></div>
      <div class="f"><span>İsimlerin yazı stili</span><div class="seg yz" data-alan="yazi">${L.YAZILAR.map(([k, ad, font]) => `<button type="button" data-v="${k}" aria-pressed="${(TASLAK.yazi||"")===k}" ${font?`style="font-family:'${font}',serif"`:""}>${ad}</button>`).join("")}</div></div>
      <div class="row">${inp("gelin","Gelin","text",'maxlength="60"')}${inp("damat","Damat","text",'maxlength="60"')}</div>
      <div class="row">${inp("tarih","Tarih","date")}${inp("saat","Saat","time")}</div>
      ${inp("aile","Aile isimleri")}${ta("not","Davet notu")}
      ${inp("mekan","Mekân")}${inp("adres","Adres")}${inp("konum","Konum linki (Google Maps)","url")}
      ${ta("program","Program (her satıra bir tane)",4)}
      <label class="f"><span>Katılım notu (formun üstünde görünür)</span><input name="katilimNotu" maxlength="240" value="${esc(TASLAK.katilimNotu)}" placeholder="Örn. Çocuklarımıza iyi uykular dileriz."></label>
      <div class="seg" id="knHazir" style="margin-top:-4px">${L.KATILIM_NOTLARI.map(t => `<button type="button" style="font-size:.78rem;padding:5px 10px">${esc(t)}</button>`).join("")}</div>
      <div class="f"><span>Müzik (dokununca dinlersiniz)</span><div class="seg" data-alan="muzik">${window.LavieMuzik.PARCALAR.concat([{ id: "yok", ad: "Müzik olmasın" }]).map(m => `<button type="button" data-v="${m.id}" aria-pressed="${(window.LavieMuzik.bul(TASLAK.muzik)||{id:"yok"}).id===m.id}">${m.ad}</button>`).join("")}</div></div>
      <div class="bar"><button class="b main" type="submit" ${V.ornek?"disabled":""}>Kaydet ve yayınla</button><button class="b" type="button" id="geri">Değişiklikleri geri al</button></div>
      <span class="muted">Kaydettiğinizde davetiyeniz anında güncellenir, linkiniz değişmez.</span>
    </form>
    <div class="onizle-kap"><span class="muted">Önizleme</span><div class="onizle"><div id="oz"></div></div></div>
  </div>`;
  const onizle = () => L.ciz($("oz"), TASLAK, async () => {}, { mesajlar: V.mesajlar });
  onizle();
  const f = $("bf");
  f.addEventListener("input", e => { if (e.target.name) { TASLAK[e.target.name] = e.target.value; onizle(); } });
  f.querySelectorAll(".seg[data-alan]").forEach(sg => sg.addEventListener("click", e => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    TASLAK[sg.dataset.alan] = b.dataset.v;
    if (sg.dataset.alan === "muzik") { const M = window.LavieMuzik; (b.dataset.v === "yok" || M.calan() === b.dataset.v) ? M.durdur() : M.baslat(b.dataset.v); }
    sg.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b));
    onizle();
  }));
  $("knHazir").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; TASLAK.katilimNotu = b.textContent; f.katilimNotu.value = b.textContent; onizle(); });
  $("geri").onclick = () => { TASLAK = { ...V.cift }; bilgiCiz(p); toast("Değişiklikler geri alındı"); };
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!TASLAK.gelin?.trim() || !TASLAK.damat?.trim() || !TASLAK.tarih) return toast("Gelin, damat ve tarih boş olamaz.");
    const btn = f.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Kaydediliyor...";
    try { const j = await islem({ islem: "guncelle", alanlar: TASLAK }); V.cift = j.cift; TASLAK = { ...j.cift }; iskelet(); SEKME = "bilgi"; ciz(); toast("Kaydedildi, davetiyeniz güncellendi"); }
    catch { btn.disabled = false; btn.textContent = "Kaydet ve yayınla"; toast("Kaydedilemedi, tekrar deneyin."); }
  });
}

function csv(){
  const lines = [["İsim","Kişi","Durum","Tarih"], ...V.yanitlar.map(x => [x.isim, x.kisi, x.durum, new Date(x.zaman).toLocaleString("tr-TR")])]
    .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines], {type:"text/csv;charset=utf-8"}));
  a.download = `${slug}-misafirler.csv`; a.click();
}

(async () => {
  const msg = $("msg");
  if (!slug || !key) { msg.textContent = "Panel linki eksik. Size gönderilen linki tam olarak açın."; return; }
  try { await yukle(); }
  catch (e) { msg.textContent = e.message === "anahtar" || e.message === "bulunamadi" ? "Panel linki geçersiz. Size gönderilen linki tam olarak açın." : "Panel yüklenemedi. Sayfayı yenileyin."; return; }
  iskelet(); ciz();
})();
</script>
</body>
</html>
